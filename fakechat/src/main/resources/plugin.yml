name: FakeChat
version: 1.0
main: me.logger.FakeChatPlugin
api-version: '1.20'
description: 

commands:
  fakechat:
    description: Отправить сообщение от лица игрока
    usage: /<command> <игрок> <сообщение>
    aliases: [fc]
    permission: fakechat.use

permissions:
  fakechat.use:
    description: Разрешает использовать команду /fakechat
    default: op