name: FakeChat
version: 1.0
main: me.logger.FakeChatPlugin
api-version: '1.20'
description: Allows sending messages on behalf of other players.

commands:
  fakechat:
    description: Send a message on behalf of a player
    usage: /<command> <player> <message>
    aliases: [fc]
    permission: fakechat.use

permissions:
  fakechat.use:
    description: Allows using the /fakechat command
    default: op