# Складывать опыт в сундук
store-xp: true

# true  - весь опыт игрока (как если бы он его не терял)
# false - только то количество, которое выпало бы по ваниле (уровень * 7, максимум 100)
store-all-xp: true

# Записывать координаты смерти каждого игрока в plugins/DeathChest/deaths.log
log-deaths: true

# Сохранять раскладку инвентаря в сундуке:
#   ряды 1-3 сундука - основной инвентарь, ряд 4 - хотбар,
#   ряд 5 - броня (шлем, нагрудник, поножи, ботинки) и предмет во второй руке.
# Если вещи только в основном инвентаре - сундук одинарный, если есть хотбар/броня/вторая рука - двойной.
# false - вещи кладутся в сундук подряд, без сохранения раскладки.
preserve-layout: true

# Если рядом нет свободного места под сундук - ломать мешающие блоки
# (они выпадают как предметы; неразрушаемые блоки и чужие сундуки смерти не трогаются).
# Внимание: плагины защиты регионов (WorldGuard и т.п.) при этом не учитываются.
break-blocks: true

# Радиус поиска свободного места, если на месте смерти стоит блок
search-radius: 4

# Пока владелец ни разу не открыл сундук, его нельзя открыть, сломать, взорвать,
# опустошить воронкой и т.д. Право deathchest.bypass (по умолчанию у операторов) обходит защиту.
protect-until-opened: true

# Через сколько минут защита снимается, даже если владелец так и не открыл сундук
# (0 - никогда, сундук защищён, пока его не откроет владелец)
unopened-timeout-minutes: 0

# Сколько секунд после смерти сундук может открыть только владелец (0 - выключено).
# Работает и после первого открытия владельцем.
protection-seconds: 0

# Удалять сундук, когда из него забрали все вещи
remove-empty-chest: true

messages:
  death: "&cВы погибли! &7Ваши вещи в сундуке: &eX: %x% &7| &eY: %y% &7| &eZ: %z% &7(мир: &e%world%&7)"
  no-space: "&cНе удалось найти место для сундука (или часть вещей не поместилась) - они выпали на землю."
  xp: "&aВы получили &e%xp% &aопыта из сундука."
  protected: "&cЭтот сундук защищён ещё &e%seconds% &cсек."
  locked: "&cЭтот сундук может открыть только его владелец."
  chest-name: "&6Вещи игрока %player%"
